name: Qmoosa Bot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-core-and-subsystems:
    name: Core Subsystems & PQC Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run 13/13 Subsystem Tests
        run: |
          python tests/run_all_tests.py

      - name: Execute Proof-of-Agent Live Demonstration
        run: |
          python marketing/proof_of_agent_demo.py

  serverpod-and-dart:
    name: Serverpod Backend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverpod_backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Serverpod Backend Dependencies
        run: dart pub get

      - name: Verify Serverpod Endpoint Code
        run: dart analyze bin lib

  flutter-lint-and-analysis:
    name: Flutter Cross-Platform Client Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze Flutter Client
        run: |
          cd flutter_client
          flutter pub get
          flutter analyze
